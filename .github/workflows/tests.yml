name: "Tests"

on:
    push:
        branches:
          - master
          - '*.x'
    pull_request:


jobs:
    run:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                  - php: '8.1'
                    laravel: '10'
                    pest: '2.35.1'
                    testbench: '^8.0'
                    phpunit: '10.5.17'
                    block_insecure: 'false'
                  - php: '8.2'
                    laravel: '10'
                    pest: '^2.0'
                    testbench: '^8.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.2'
                    laravel: '11'
                    pest: '^3.0'
                    testbench: '^9.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.3'
                    laravel: '11'
                    pest: '^3.0'
                    testbench: '^9.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.2'
                    laravel: '12'
                    pest: '^3.0'
                    testbench: '^10.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.3'
                    laravel: '12'
                    pest: '^3.0'
                    testbench: '^10.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.3'
                    laravel: '13'
                    pest: '^4.0'
                    testbench: '^11.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.4'
                    laravel: '11'
                    pest: '^3.0'
                    testbench: '^9.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.5'
                    laravel: '11'
                    pest: '^3.0'
                    testbench: '^9.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.4'
                    laravel: '12'
                    pest: '^3.0'
                    testbench: '^10.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.5'
                    laravel: '12'
                    pest: '^3.0'
                    testbench: '^10.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.4'
                    laravel: '13'
                    pest: '^4.0'
                    testbench: '^11.0'
                    phpunit: ''
                    block_insecure: 'true'
                  - php: '8.5'
                    laravel: '13'
                    pest: '^4.0'
                    testbench: '^11.0'
                    phpunit: ''
                    block_insecure: 'true'

        name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }}

        steps:
          - name: Setup PHP
            uses: shivammathur/setup-php@v2
            with:
                php-version: ${{ matrix.php }}

          - name: Checkout code
            uses: actions/checkout@v3

          - name: Install dependencies
            run: |
                composer config audit.block-insecure "${{ matrix.block_insecure }}"
                composer require "illuminate/support=^${{ matrix.laravel }}" "illuminate/validation=^${{ matrix.laravel }}" --no-update
                dev_requirements=(
                    "orchestra/testbench=${{ matrix.testbench }}"
                    "pestphp/pest=${{ matrix.pest }}"
                )

                if [ -n "${{ matrix.phpunit }}" ]; then
                    dev_requirements+=("phpunit/phpunit=${{ matrix.phpunit }}")
                fi

                composer require --dev "${dev_requirements[@]}" --no-update
                composer update --prefer-dist --no-interaction --no-progress

          - name: Execute tests
            run: ./vendor/bin/pest
